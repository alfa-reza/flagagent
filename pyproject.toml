[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "flagagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "openai>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires Docker Engine for container integration tests",
]

[tool.ruff]
target-version = "py312"
preview = false

[tool.ruff.lint]
ignore = ["BLE001"]
