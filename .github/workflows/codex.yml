name: codex

on:
  issue_comment:
    types: [created]

concurrency:
  group: codex-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  codex:
    if: |
      !github.event.issue.pull_request &&
      github.actor == github.repository_owner &&
      (github.event.comment.body == '/codex' ||
       startsWith(github.event.comment.body, '/codex '))

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          python-version: "3.12"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY }}
          responses-api-endpoint: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          model: ${{ vars.CODEX_MODEL }}
          codex-version: "0.148.0"
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          prompt: |
            Fix GitHub issue #${{ github.event.issue.number }} in this repository.

            Read and follow AGENTS.md before making changes.

            Issue title:
            ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Maintainer request:
            ${{ github.event.comment.body }}

            Implement the smallest correct fix that satisfies the issue acceptance
            criteria. Avoid unrelated refactors and unnecessary dependencies. Add or
            update deterministic regression tests when appropriate.

            Run the relevant targeted tests before finishing.

            Do not commit, push, create branches, or open pull requests.
            Leave the completed changes in the working tree.

      - name: Format changes
        run: uv run ruff format .

      - name: Create draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Codex made no changes."
            exit 0
          fi

          branch="codex/issue-${ISSUE_NUMBER}-${RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$branch"
          git add -A
          git commit -m "fix: resolve issue #${ISSUE_NUMBER}"
          git push -u origin "$branch"

          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$branch" \
            --title "Fix issue #${ISSUE_NUMBER}" \
            --body "Automated Codex implementation for issue #${ISSUE_NUMBER}.

          Closes #${ISSUE_NUMBER}" \
            --draft
