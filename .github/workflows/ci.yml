name: FlagAgent CI

on:
  push:
  pull_request:

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Package dry run
        run: npm pack --dry-run

  real-docker:
    name: Real Docker
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build sandbox image
        run: docker build -t flagagent-sandbox:dev -f images/sandbox/Dockerfile .
      - name: Build target image
        run: docker build -t flagagent-target:dev -f images/target/Dockerfile .
      - name: Real Docker integration
        run: npm run test:real-docker
